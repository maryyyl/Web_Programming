<!DOCTYPE html>
<html lang="eng" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/html">
<head>
  <meta charset="utf-8">
  <title>Book Reservation - Welcome and choose a Book</title>
  <style>
    body {
      width: 800px;
      margin: auto;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #333;
    }
    form {
      margin-top: 20px;
    }
    .book-option {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .book-option:hover {
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
<th:block sec:authorize="isAnonymous()">
  <a href="/login">Log In</a>
</th:block>

<header>
  <h1>Welcome to our Book Reservation App</h1>
</header>
<main>
  <form action="/bookReservation" method="POST">
      <h2>Enter your information:</h2>
      <label>Your Name:</label>
      <input type="text" name="readerName" required><br/>
      <label>Your Address:</label>
      <input type="text" name="readerAddress" required><br/>
    <h2>Choose a book:</h2>
    <table>
      <tr th:each="book: ${books}">
        <td><input style="display: block" name="chosenBook" type="radio" th:text="'Title: '+${book.getTitle()} + ', Genre: '+${book.getGenre()}+', Author: '+${book.getAuthor().getName()} + ' ' +${book.getAuthor().getSurname()}" th:value="${book.getTitle()}"></td>
        <th:block sec:authorize="hasRole('ADMIN')">
        <td ><a th:href="'/books/edit/'+${book.id}">Edit</a></td>
        </th:block>
        <th:block sec:authorize="hasRole('ADMIN')">
        <td><a th:href="'/books/delete/'+${book.id}">Delete</a></td>
        </th:block>
      </tr>
    </table>
    <th:block sec:authorize="hasRole('ADMIN')">
      <p><a href="/books/add-form">Add book to list</a></p>
    </th:block>
    <h2>Choose number of copies:</h2>
    <input type="number" name="numCopies" min="1" max="10" required><br/>
    <br/>
    <input type="submit" value="Reserve Book">
  </form>
<!--  <form action="/bookReservation1" method="POST">-->
<!--    <h2>Enter your information:</h2>-->
<!--    <label>Your Name:</label>-->
<!--    <input type="text" name="readerName" required><br/>-->
<!--    <label>Your Address:</label>-->
<!--    <input type="text" name="readerAddress" required><br/>-->
<!--    <button style="display: block" type="submit">Show user's reserved books</button>-->
<!--  </form>-->

  <h2>Search books:</h2>
  <form action="/searchBook" method="POST">
    <label for="search-input">Search text:</label>
    <input required id="search-input" type="text" name="searchText">
    <br>
    <label for="rating-input">Rating value:</label>
    <input required id="rating-input" name="ratingValue" type="text">
    <button style="display: block" type="submit">Search</button>
  </form>
<div th:if="${searchedBooks!=null and searchedBooks.size()>0}">
  <p>The books containing search key word and having rating above are:</p>
  <ul >
    <li th:each="b:${searchedBooks}" th:text="${b.title}"></li>
  </ul>
</div>

  <h3>The most reserved book is:</h3>
  <span  style="margin-bottom: 20px;display: block" th:text="${maxCopiesBook}"></span>
</main>
</body>
</html>
